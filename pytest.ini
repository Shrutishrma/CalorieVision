[pytest]
# Register custom markers so pytest doesn't warn about unknown ones
markers =
    network: marks tests that make real network calls (deselect with -m "not network")
    real_video: marks tests that require a real workout video in shared/test-videos/

# Default test paths
testpaths =
    tests
    cv-pipeline/eval
    fusion-pipeline/segmentation

# Asyncio mode (for pytest-asyncio)
asyncio_mode = strict

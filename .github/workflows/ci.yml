name: CI

on:
  pull_request:
    branches: [main, master]
  push:
    branches: [main, master]

jobs:
  python-tests:
    name: Python Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          # Lightweight deps for CI (skip torch/mediapipe/easyocr — too heavy)
          pip install fastapi uvicorn pydantic httpx pytest pytest-asyncio yt-dlp opencv-python

      - name: Run pytest (skip network + real_video tests)
        run: |
          pytest \
            tests/ \
            fusion-pipeline/segmentation/ \
            -v --tb=short \
            -m "not network and not real_video"
